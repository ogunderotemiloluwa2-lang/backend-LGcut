# Render Blueprint — deploys the LG CUT backend API.
# In Render: New → Blueprint → connect this repo. Render reads this file.
services:
  - type: web
    name: lg-cut-backend
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: ADMIN_TOKEN
        value: "24434"
      - key: FORMSPREE_ENDPOINT
        value: "https://formspree.io/f/xdekoqbb"
      # Set these in the Render dashboard (do NOT commit secrets):
      - key: FRONTEND_URL
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
